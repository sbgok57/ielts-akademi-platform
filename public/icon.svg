<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kare (Retina App Badge) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Dış İnce Altın Halka -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 2" opacity="0.75" />

  <!-- Mezuniyet Şapkası (Mortarboard) -->
  <path d="M32 14 L52 24 L32 34 L12 24 Z" fill="#FFFFFF" filter="url(#shadow)" />
  <path d="M20 28.5 L20 38.5 C20 44 44 44 44 38.5 L44 28.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Püskül (Tassel) -->
  <path d="M47 26.5 L49 37 L51 37" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="47" cy="26" r="1.5" fill="url(#goldGrad)" />
  <rect x="48" y="37" width="4" height="5" rx="1" fill="url(#goldGrad)" />

  <!-- Altın Taç ve Yıldız Vurgusu -->
  <path d="M26 48 L28 44 L32 46 L36 44 L38 48 Z" fill="url(#goldGrad)" />
  <circle cx="32" cy="42" r="1.5" fill="#FFFFFF" />

  <!-- "IELTS" Parlak Akreditasyon Rozeti -->
  <rect x="15" y="47" width="34" height="11" rx="4" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="1" />
  <text x="32" y="55.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">IELTS</text>
</svg>
